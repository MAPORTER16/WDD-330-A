<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sleep Outside | Checkout</title>

  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/checkout.js" type="module"></script>
</head>

<body>
  <header class="divider" id="main-header"></header>

  <main class="divider">
    <section class="products">
      <h2>Review & Place your Order</h2>

      <form name="checkout">
        <fieldset>
          <legend>Customer Information</legend>
          <label for="fname">First Name</label>
          <input type="text" id="fname" name="fname" placeholder="John" required />
          <label for="lname">Last Name</label>
          <input type="text" id="lname" name="lname" placeholder="Doe" required />
          <label for="street">Street Address</label>
          <input type="text" id="street" name="street" placeholder="123 Main St" required />
          <label for="city">City</label>
          <input type="text" id="city" name="city" placeholder="Springfield" required />
          <label for="state">State</label>
          <input type="text" id="state" name="state" placeholder="IL" required />
          <label for="zip">Zip Code</label>
          <input type="text" id="zip" name="zip" pattern="\d{5}" placeholder="12345" required />
        </fieldset>

        <fieldset>
          <legend>Payment Information</legend>
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" name="cardNumber" pattern="\d{16}" placeholder="1234567890123456"
            required />
          <label for="expiration">Expiration Date</label>
          <input type="text" id="expiration" name="expiration" placeholder="01/27" required />
          <label for="code">Security Code</label>
          <input type="text" id="code" name="code" pattern="\d{3}" placeholder="123" required />
        </fieldset>

        <fieldset class="order-summary">
          <legend>Order Summary</legend>
          <p>Items: <span id="num-items">0</span></p>
          <p>Subtotal: <span id="cartTotal">$0.00</span></p>
          <p>Shipping Estimate: <span id="shipping-estimate">$0.00</span></p>
          <p>Tax: <span id="tax">$0.00</span></p>
          <p><strong>Order Total: <span id="order-total">$0.00</span></strong></p>
        </fieldset>

        <button id="checkoutSubmit" type="submit">Place Order</button>
      </form>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
